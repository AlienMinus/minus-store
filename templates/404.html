{% extends 'base.html' %}
{% block title %}Game Over — 404 Not Found — {{ store_about.name }}{% endblock %}
{% block content %}
<section class="not-found arcade-not-found">
  <div class="game-over-banner">
    <span class="eyebrow arcade-red-eyebrow">ERROR 404 // GAME OVER</span>
    <h1 class="game-over-title glitch-text">GAME OVER</h1>
    <div class="game-over-prompt blink">INSERT COIN TO CONTINUE: 9</div>
    <p class="game-over-desc">Project not found. That cartridge doesn't exist in this cabinet.</p>
  </div>
  <div class="game-over-actions">
    <a class="button primary arcade-launch-btn" href="{{ url_for('index') }}">
      <span class="btn-coin">🪙</span> RESTART GAME (LOBBY)
    </a>
  </div>
</section>
{% endblock %}
